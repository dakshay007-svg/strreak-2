<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streak Flame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #191919;            /* Notion dark background */
    --card: #202020;
    --line: #2f2f2f;
    --text: #e8e8e8;
    --muted: #8d8d8d;
    --red: #ff3355;
    --blue: #2f7bff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 12px;
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    padding: 16px 20px 16px;
    border-radius: 18px;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(47,123,255,.10), transparent 60%),
      radial-gradient(90% 60% at 50% 100%, rgba(255,51,85,.08), transparent 70%),
      var(--card);
    border: 1px solid var(--line);
    text-align: center;
    overflow: hidden;
  }

  /* ---------- level palettes (set by data-level on .card) ---------- */
  .card {
    /* level 1 : blue (default) */
    --oT:#1d6bff; --oB:#0a3fd1;
    --mT:#3f9bff; --mB:#1e6fff;
    --iT:#8fd0ff; --iB:#4aa8ff;
    --cT:#ffffff; --cB:#d6f0ff;
    --glow:#2f7bff; --spark:#7fc0ff;
    --n1:#9fd2ff; --n2:#2f7bff;
    --flame-opacity:1; --flame-scale:1;
  }
  .card[data-level="0"] {
    --oT:#4a4a4a; --oB:#2a2a2a;
    --mT:#5a5a5a; --mB:#353535;
    --iT:#6a6a6a; --iB:#454545;
    --cT:#8a8a8a; --cB:#606060;
    --glow:#555; --spark:#888;
    --n1:#9a9a9a; --n2:#5a5a5a;
    --flame-opacity:.55; --flame-scale:.72;
  }
  .card[data-level="2"] {           /* 10+ days : dark blue layer */
    --oT:#1a2fbf; --oB:#070f5c;
    --mT:#2447e6; --mB:#0f1f9c;
    --iT:#4f7bff; --iB:#2447e6;
    --cT:#b9d4ff; --cB:#7aa6ff;
    --glow:#1f3bff; --spark:#5b7cff;
    --n1:#7a9bff; --n2:#1a2fbf;
  }
  .card[data-level="3"] {           /* 20+ days : blue base, red top */
    --oT:#ff2a45; --oB:#1236d6;
    --mT:#ff5a5a; --mB:#2a62ff;
    --iT:#ff8a7a; --iB:#5a8cff;
    --cT:#fff0f0; --cB:#cfe3ff;
    --glow:#d8366f; --spark:#ff6b7d;
    --n1:#ff5a6e; --n2:#2f6bff;
  }
  .card[data-level="4"] {           /* 30+ days : red + purple */
    --oT:#ff1744; --oB:#7a1fd6;
    --mT:#ff4d6d; --mB:#a93df0;
    --iT:#ff8fb3; --iB:#c77dff;
    --cT:#fff0f7; --cB:#f3d9ff;
    --glow:#b030ff; --spark:#e05bff;
    --n1:#ff4d6d; --n2:#b030ff;
  }

  .card[data-level="5"] {           /* 50+ days : golden fire (gold + red) */
    --oT:#ff3b30; --oB:#a31515;
    --mT:#f0a030; --mB:#d4481c;
    --iT:#ffd36b; --iB:#f08a24;
    --cT:#ffffff; --cB:#ffe9b0;
    --glow:#e8662a; --spark:#ffb24a;
    --n1:#ffd36b; --n2:#ff5a2a;
    border-color: rgba(240,138,36,.55);
    box-shadow: 0 0 24px rgba(255,150,40,.15);
  }
  .card[data-level="5"] .halo { opacity: .5; }
  .card { transition: border-color .8s ease, box-shadow .8s ease; }

  .title {
    margin: 0 0 2px;
    font-size: 13px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  /* ---------- flame ---------- */
  .stage {
    position: relative;
    width: 180px;
    height: 205px;
    margin: 16px auto 0;
  }
  .flame-btn {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    background: none; border: 0; padding: 0;
    cursor: pointer;
    outline: none;
    border-radius: 50%;
  }
  .flame-btn:focus-visible { box-shadow: 0 0 0 2px var(--blue); }
  .flame-btn[disabled] { cursor: default; }

  .halo {
    position: absolute; left: 50%; top: 58%;
    width: 200px; height: 200px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
    opacity: .30;
    filter: blur(14px);
    transition: opacity .8s ease, background .8s ease;
    animation: halo 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  .card[data-level="0"] .halo { opacity: .08; animation: none; }

  svg.flame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
    transform-origin: 50% 94%;
    transform: scale(var(--flame-scale));
    opacity: var(--flame-opacity);
    filter: drop-shadow(0 0 14px var(--glow));
    transition: transform .6s cubic-bezier(.2,.9,.3,1.2), opacity .6s ease, filter .8s ease;
  }
  .flame-btn:not([disabled]):hover svg.flame { transform: scale(calc(var(--flame-scale) * 1.04)); }
  .flame-btn:not([disabled]):active svg.flame { transform: scale(calc(var(--flame-scale) * .96)); }

  /* gradient stops follow the level palette, and fade smoothly between levels */
  .s { transition: stop-color .8s ease; }
  .o-t { stop-color: var(--oT); } .o-b { stop-color: var(--oB); }
  .m-t { stop-color: var(--mT); } .m-b { stop-color: var(--mB); }
  .i-t { stop-color: var(--iT); } .i-b { stop-color: var(--iB); }
  .c-t { stop-color: var(--cT); } .c-b { stop-color: var(--cB); }

  .layer { transform-box: fill-box; transform-origin: 50% 100%; }
  .l-outer { animation: sway 2.6s ease-in-out infinite, lick 1.7s ease-in-out infinite; }
  .l-mid   { animation: sway 2.1s ease-in-out infinite reverse, lick 1.3s ease-in-out infinite .2s; }
  .l-inner { animation: lick 1.05s ease-in-out infinite .1s; }
  .l-core  { animation: lick .8s ease-in-out infinite .3s; }
  .l-tongue-l { animation: tongue 1.9s ease-in-out infinite; }
  .l-tongue-r { animation: tongue 2.3s ease-in-out infinite .5s; }
  .card[data-level="0"] .layer { animation-duration: 5s; }

  @keyframes sway  { 0%,100% { transform: skewX(-2.5deg); } 50% { transform: skewX(2.5deg); } }
  @keyframes lick  { 0%,100% { transform: scale(1,1); } 45% { transform: scale(.96,1.07); } 70% { transform: scale(1.03,.96); } }
  @keyframes tongue{ 0%,100% { transform: scale(1,.85) rotate(-3deg); opacity:.75; } 50% { transform: scale(1,1.15) rotate(4deg); opacity:1; } }
  @keyframes halo  { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.07); } }

  .stage.press svg.flame { animation: press .6s cubic-bezier(.2,.9,.3,1.3); }
  .stage.deny  svg.flame { animation: deny .45s ease; }
  @keyframes press { 0% { filter: drop-shadow(0 0 14px var(--glow)) brightness(1); }
                     35%{ filter: drop-shadow(0 0 40px var(--glow)) brightness(1.7); transform: scale(calc(var(--flame-scale)*1.14)); }
                     100%{ filter: drop-shadow(0 0 14px var(--glow)) brightness(1); } }
  @keyframes deny  { 0%,100% { translate: 0 0; } 20% { translate: -6px 0; } 40% { translate: 6px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }

  .ripple {
    position: absolute; left: 50%; top: 66%;
    width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border-radius: 50%;
    border: 2px solid var(--glow);
    opacity: 0; pointer-events: none;
  }
  .ripple.go { animation: ripple .9s ease-out; }
  @keyframes ripple { 0% { opacity:.9; transform: scale(.4); } 100% { opacity:0; transform: scale(5.5); } }

  .spark {
    position: absolute; left: 50%; top: 62%;
    width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: var(--spark);
    box-shadow: 0 0 8px var(--spark);
    pointer-events: none;
    animation: spark var(--dur, 1s) cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes spark {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.1); opacity: 0; }
  }

  /* ---------- number ---------- */
  .count-wrap { margin-top: -4px; }
  .count {
    font-family: "Orbitron", "Rajdhani", sans-serif;
    font-weight: 900;
    font-size: 54px;
    line-height: 1;
    letter-spacing: .02em;
    background: linear-gradient(180deg, var(--n1), var(--n2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 0 12px color-mix(in srgb, var(--glow) 55%, transparent));
    display: inline-block;
  }
  .count.pop { animation: pop .55s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .unit {
    margin-top: 2px;
    font-size: 14px;
    letter-spacing: .38em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  .msg { position: relative; margin-top: 8px; }
  .msg .status, .msg .sub { transition: opacity .6s ease; }
  .msg.quoting .status, .msg.quoting .sub { opacity: 0; }

  /* milestone quote: fades in over the status text, then fades away */
  .quote-wrap {
    position: absolute; inset: -4px -4px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .quote {
    display: block; max-width: 100%;
    padding: 0 6px;
    font-size: 16px; font-weight: 600; font-style: italic;
    line-height: 1.25; letter-spacing: .1em;
    background: linear-gradient(90deg, var(--q1, #fff), var(--q2, #fff));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    opacity: 0;
    transform: translateY(8px) scale(.97);
    filter: blur(7px) drop-shadow(0 0 8px color-mix(in srgb, var(--q1, #fff) 45%, transparent));
    transition: opacity .9s ease, transform 1s cubic-bezier(.2,.8,.2,1), filter .9s ease, letter-spacing 1.2s ease;
  }
  .quote.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0) drop-shadow(0 0 8px color-mix(in srgb, var(--q1, #fff) 45%, transparent));
    letter-spacing: .03em;
  }

  /* crown for the golden flame: drops in with the quote, lifts away with it */
  .crown {
    position: absolute; left: 50%; top: -16px;
    width: 48px; height: 34px; margin-left: -24px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-30px) scale(.5) rotate(-12deg);
    filter: drop-shadow(0 0 10px rgba(255,160,40,.85));
    transition: opacity .8s ease, transform .9s cubic-bezier(.5,0,.8,.4), filter .8s ease;
  }
  .crown.show {
    opacity: 1;
    transform: translateY(0) scale(1) rotate(0);
    transition: opacity .5s ease, transform 1s cubic-bezier(.2,1.5,.3,1), filter .8s ease;
  }
  .crown svg { display: block; width: 100%; height: 100%; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .crown .glint { animation: glint 2.4s ease-in-out infinite; }
  @keyframes glint { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  .status {
    min-height: 22px;
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }
  .sub { margin: 0; font-size: 14px; color: var(--muted); min-height: 18px; }

  /* progress to next flame */
  .progress { margin: 10px auto 0; width: 82%; }
  .bar { height: 6px; border-radius: 6px; background: #2b2b2b; overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--n2), var(--n1));
    transition: width .8s cubic-bezier(.2,.9,.3,1), background .8s ease;
  }
  .plabel { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

  .stats { display: flex; justify-content: center; gap: 22px; margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .stats b { display: block; font-family: "Orbitron", sans-serif; font-size: 16px; color: var(--text); letter-spacing: 0; margin-bottom: 1px; }

  /* start button */
  .start {
    margin-top: 10px;
    padding: 11px 26px;
    border: 0; border-radius: 12px;
    font-family: inherit; font-size: 17px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, var(--blue), var(--red));
    box-shadow: 0 6px 24px rgba(47,123,255,.35);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .start:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,51,85,.35); }
  .start:active { transform: translateY(0) scale(.98); }
  .hidden { display: none !important; }

  /* preview tools (only with ?preview=1) */
  .preview { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .preview button {
    background: #2a2a2a; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .preview button:hover { border-color: var(--blue); }
  .preview .note { width: 100%; font-size: 12px; color: var(--muted); }

  @media (max-width: 360px) {
    .count { font-size: 46px; }
    .quote { font-size: 14px; }
    .stage { transform: scale(.9); margin-bottom: -16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="card" id="card" data-level="0">
  <p class="title">Streak Flame</p>

  <div class="stage" id="stage">
    <div class="halo"></div>
    <div class="ripple" id="ripple"></div>

    <button class="flame-btn" id="flameBtn" type="button" aria-label="Light today's flame">
      <svg class="flame" viewBox="0 0 200 260" aria-hidden="true">
        <defs>
          <linearGradient id="gO" x1="0" y1="0" x2="0" y2="1"><stop class="s o-t" offset="0"/><stop class="s o-b" offset="1"/></linearGradient>
          <linearGradient id="gM" x1="0" y1="0" x2="0" y2="1"><stop class="s m-t" offset="0"/><stop class="s m-b" offset="1"/></linearGradient>
          <linearGradient id="gI" x1="0" y1="0" x2="0" y2="1"><stop class="s i-t" offset="0"/><stop class="s i-b" offset="1"/></linearGradient>
          <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop class="s c-t" offset="0"/><stop class="s c-b" offset="1"/></linearGradient>
        </defs>
        <!-- small side tongues -->
        <path class="layer l-tongue-l" fill="url(#gO)" d="M52 150 C42 128 52 108 60 92 C62 112 74 120 72 144 C70 158 58 164 52 150 Z"/>
        <path class="layer l-tongue-r" fill="url(#gO)" d="M150 140 C160 120 152 104 146 88 C142 108 130 116 130 138 C130 154 144 160 150 140 Z"/>
        <!-- main layers, outside to inside -->
        <path class="layer l-outer" fill="url(#gO)" d="M100 8 C110 50 160 80 160 150 C160 205 135 245 100 248 C65 245 40 205 40 150 C40 110 62 92 72 62 C80 90 92 70 100 8 Z"/>
        <path class="layer l-mid"   fill="url(#gM)" d="M100 60 C108 92 142 112 142 160 C142 202 124 232 100 234 C76 232 58 202 58 160 C58 130 76 118 84 96 C92 112 98 92 100 60 Z"/>
        <path class="layer l-inner" fill="url(#gI)" d="M100 118 C106 138 124 150 124 182 C124 208 114 224 100 225 C86 224 76 208 76 182 C76 160 90 152 94 136 C98 146 100 134 100 118 Z"/>
        <path class="layer l-core"  fill="url(#gC)" d="M100 170 C108 184 114 194 114 208 C114 218 108 224 100 224 C92 224 86 218 86 208 C86 194 92 184 100 170 Z"/>
      </svg>
    </button>
    <div class="crown" id="crown" aria-hidden="true">
      <svg viewBox="0 0 60 42">
        <defs>
          <linearGradient id="gCr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1b0"/><stop offset=".55" stop-color="#ffb52e"/><stop offset="1" stop-color="#d9631a"/></linearGradient>
        </defs>
        <path d="M5 36 L8 11 L21 24 L30 5 L39 24 L52 11 L55 36 Z" fill="url(#gCr)" stroke="#ffe9a8" stroke-width="1.2" stroke-linejoin="round"/>
        <rect x="5" y="34" width="50" height="6" rx="2" fill="url(#gCr)" stroke="#ffe9a8" stroke-width="1.2"/>
        <circle cx="8" cy="10" r="3" fill="#ff3b4d"/><circle cx="30" cy="4.5" r="3.4" fill="#ff3b4d"/><circle cx="52" cy="10" r="3" fill="#ff3b4d"/>
        <circle class="glint" cx="30" cy="4.5" r="1.3" fill="#fff"/>
        <circle cx="19" cy="37" r="1.6" fill="#ff3b4d"/><circle cx="30" cy="37" r="1.6" fill="#ff3b4d"/><circle cx="41" cy="37" r="1.6" fill="#ff3b4d"/>
      </svg>
    </div>
  </div>

  <div class="count-wrap">
    <div class="count" id="count">0</div>
    <div class="unit">day streak</div>
  </div>

  <div class="msg" id="msg">
    <p class="status" id="status">Ready when you are</p>
    <p class="sub" id="sub"></p>
    <div class="quote-wrap"><span class="quote" id="quote" aria-live="polite"></span></div>
  </div>

  <button class="start hidden" id="startBtn" type="button">Ignite my streak</button>

  <div class="progress hidden" id="progress">
    <div class="bar"><i id="barFill"></i></div>
    <div class="plabel"><span id="pLeft">Blue</span><span id="pRight">Dark blue</span></div>
  </div>

  <div class="stats hidden" id="stats">
    <div><b id="bestVal">0</b>Best</div>
  </div>

  <div class="preview hidden" id="preview">
    <span class="note">Preview tools: these change the picture only and never save anything.</span>
    <button type="button" data-n="0">Unlit</button>
    <button type="button" data-n="1">Day 1</button>
    <button type="button" data-n="10">Day 10</button>
    <button type="button" data-n="20">Day 20</button>
    <button type="button" data-n="30">Day 30</button>
    <button type="button" data-n="50">Day 50</button>
    <button type="button" id="resetBtn">Erase saved streak</button>
  </div>
</main>

<script>
(function () {
  "use strict";

  /* ============ settings you may want to change ============ */
  var STORAGE_KEY = "wod-flame-v1";
  // streak needed to reach each flame level
  var LEVELS = [
    { min: 1,  name: "Blue" },
    { min: 10, name: "Dark blue" },
    { min: 20, name: "Blue + red" },
    { min: 30, name: "Red + purple" },
    { min: 50, name: "Golden" }
  ];
  // quote shown when a flame level is reached. c1 -> c2 is the colour of the
  // PREVIOUS flame (the one the player is leaving). Key = flame level (1 = first flame).
  var MILESTONES = {
    1: { quote: "Every fire starts with one spark.",                        c1: "#d5dae2", c2: "#8f96a1" },
    2: { quote: "Ten days in. You're not trying anymore, you're becoming.", c1: "#9fd2ff", c2: "#2f7bff" },
    3: { quote: "Twenty days. The habit now works for you.",                c1: "#8fa8ff", c2: "#4a63ff" },
    4: { quote: "Thirty days. This is who you are now.",                    c1: "#ff5a6e", c2: "#2f6bff" },
    5: { quote: "Fifty days unbroken. Victory belongs to those who stay.",  c1: "#ff4d6d", c2: "#b030ff", crown: true }
  };
  var QUOTE_SHOW_MS = 5000;     // how long the quote (and crown) stay
  var QUOTE_DELAY_MS = 450;     // wait so the flame starts changing colour first
  /* ========================================================= */

  var $ = function (id) { return document.getElementById(id); };
  var card = $("card"), stage = $("stage"), flameBtn = $("flameBtn"), countEl = $("count");
  var statusEl = $("status"), subEl = $("sub"), startBtn = $("startBtn");
  var progress = $("progress"), barFill = $("barFill"), pLeft = $("pLeft"), pRight = $("pRight");
  var stats = $("stats"), bestVal = $("bestVal");
  var ripple = $("ripple"), msgEl = $("msg"), quoteEl = $("quote"), crownEl = $("crown");

  /* ---------- storage (safe if the browser blocks it) ---------- */
  var memory = null;
  function load() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s === "object" && s.started === true) {
          return {
            started: true,
            startDate: typeof s.startDate === "string" ? s.startDate : "",
            lastPress: typeof s.lastPress === "string" ? s.lastPress : "",
            streak: Math.max(0, parseInt(s.streak, 10) || 0),
            best: Math.max(0, parseInt(s.best, 10) || 0)
          };
        }
      }
    } catch (e) { if (memory) return memory; }
    return memory || { started: false, startDate: "", lastPress: "", streak: 0, best: 0 };
  }
  function save(s) {
    memory = s;
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  /* ---------- dates (the player's own local calendar day) ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function dayNum(str) { var p = str.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
  function diffDays(a, b) { return Math.round(dayNum(b) - dayNum(a)); }   // b - a
  function niceDate(str) {
    if (!str) return "-";
    var p = str.split("-");
    var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return m[+p[1] - 1] + " " + (+p[2]);
  }

  /* ---------- level from streak ---------- */
  function levelFor(streak, started) {
    if (!started) return 0;
    var lvl = 1;                       // started but 0 days (streak broken) still shows a blue flame
    for (var i = 0; i < LEVELS.length; i++) if (streak >= LEVELS[i].min) lvl = i + 1;
    return lvl;
  }

  /* ---------- the state, checked every time the page opens ---------- */
  var state = load();
  var brokeNow = false;

  function checkMissedDay() {
    if (!state.started || !state.lastPress) return;
    var gap = diffDays(state.lastPress, todayStr());
    if (gap > 1 && state.streak > 0) {         // a whole day was skipped
      state.streak = 0;
      brokeNow = true;
      save(state);
    }
  }
  function pressedToday() {
    if (!state.started || !state.lastPress) return false;
    return diffDays(state.lastPress, todayStr()) <= 0;   // also covers a clock set backwards
  }

  /* ---------- drawing ---------- */
  function render(streak, started, preview) {
    var lvl = levelFor(streak, started);
    card.setAttribute("data-level", String(lvl));
    countEl.textContent = streak;

    startBtn.classList.toggle("hidden", started || preview);
    progress.classList.toggle("hidden", !started && !preview);
    stats.classList.toggle("hidden", !started || preview);

    // progress bar toward the next flame colour
    var next = null;
    for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].min > streak) { next = i; break; }
    if (lvl === 0) {
      barFill.style.width = "0%"; pLeft.textContent = "Unlit"; pRight.textContent = "Blue";
    } else if (next === null) {
      barFill.style.width = "100%"; pLeft.textContent = LEVELS[LEVELS.length - 1].name; pRight.textContent = "Max flame";
    } else {
      var from = next === 0 ? 0 : LEVELS[next - 1].min;
      var pct = Math.max(0, Math.min(100, ((streak - from) / (LEVELS[next].min - from)) * 100));
      barFill.style.width = pct + "%";
      pLeft.textContent = lvl === 1 && streak === 0 ? "Relight" : LEVELS[lvl - 1].name;
      pRight.textContent = LEVELS[next].name;
    }

    if (preview) {
      statusEl.textContent = "";
      subEl.textContent = "";
      flameBtn.disabled = true;
      return;
    }

    bestVal.textContent = state.best;

    if (!started) {
      statusEl.textContent = "Your flame is waiting";
      subEl.textContent = "Press the button below. You can only do this once.";
      flameBtn.disabled = true;
      flameBtn.setAttribute("aria-label", "Flame not started");
      return;
    }
    var done = pressedToday();
    flameBtn.disabled = false;
    flameBtn.setAttribute("aria-label", done ? "Today is already counted" : "Light today's flame");
    if (brokeNow) {
      statusEl.textContent = "The flame went out";
      subEl.textContent = "You missed a day. Press the flame to start again.";
    } else if (done) {
      statusEl.textContent = "Today is counted";
      subEl.textContent = next === null ? "Maximum flame. Keep it alive!" : "Come back tomorrow. " + (LEVELS[next].min - streak) + " more day" + (LEVELS[next].min - streak === 1 ? "" : "s") + " to " + LEVELS[next].name.toLowerCase() + ".";
    } else {
      statusEl.textContent = "Press the flame";
      subEl.textContent = streak > 0 ? "Keep your " + streak + "-day streak alive today." : "Light today to begin again.";
    }
  }

  /* ---------- effects ---------- */
  function burst(count) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    for (var i = 0; i < count; i++) {
      var s = document.createElement("span");
      s.className = "spark";
      var ang = (-Math.PI / 2) + (Math.random() - 0.5) * 2.4;
      var dist = 70 + Math.random() * 110;
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      s.style.setProperty("--dur", (0.7 + Math.random() * 0.8) + "s");
      var size = 3 + Math.random() * 5;
      s.style.width = s.style.height = size + "px";
      s.addEventListener("animationend", function (e) { if (e.target.parentNode) e.target.parentNode.removeChild(e.target); });
      stage.appendChild(s);
    }
  }
  function play(cls) {
    stage.classList.remove("press", "deny");
    void stage.offsetWidth;                // restart the animation
    stage.classList.add(cls);
  }
  function ringPulse() {
    ripple.classList.remove("go"); void ripple.offsetWidth; ripple.classList.add("go");
  }
  function popNumber() {
    countEl.classList.remove("pop"); void countEl.offsetWidth; countEl.classList.add("pop");
  }

  var tIn = null, tOut = null;
  function hideQuote() {
    quoteEl.classList.remove("show");
    crownEl.classList.remove("show");
    msgEl.classList.remove("quoting");
  }
  function celebrate(level) {
    clearTimeout(tIn); clearTimeout(tOut);
    hideQuote();
    var m = MILESTONES[level];
    if (!m) return;
    tIn = setTimeout(function () {
      quoteEl.textContent = m.quote;
      quoteEl.style.setProperty("--q1", m.c1);
      quoteEl.style.setProperty("--q2", m.c2);
      void quoteEl.offsetWidth;
      quoteEl.classList.add("show");
      msgEl.classList.add("quoting");
      if (m.crown) crownEl.classList.add("show");
      tOut = setTimeout(hideQuote, QUOTE_SHOW_MS);
    }, QUOTE_DELAY_MS);
  }

  /* ---------- actions ---------- */
  function start() {
    if (state.started) return;                        // lifetime, one time only
    var t = todayStr();
    state = { started: true, startDate: t, lastPress: t, streak: 1, best: 1 };
    save(state);
    brokeNow = false;
    render(state.streak, true, false);
    play("press"); ringPulse(); popNumber(); burst(26);
    celebrate(1);
  }

  function press() {
    if (!state.started) return;
    if (pressedToday()) {                             // second press on the same day does nothing
      play("deny");
      statusEl.textContent = "Already counted today";
      return;
    }
    var before = levelFor(state.streak, true);
    var gap = state.lastPress ? diffDays(state.lastPress, todayStr()) : 99;
    state.streak = (gap === 1) ? state.streak + 1 : 1;
    state.lastPress = todayStr();
    if (state.streak > state.best) state.best = state.streak;
    save(state);
    brokeNow = false;

    var after = levelFor(state.streak, true);
    render(state.streak, true, false);
    play("press"); ringPulse(); popNumber();
    burst(after > before ? 60 : 22);
    if (after > before) celebrate(after);
  }

  flameBtn.addEventListener("click", press);
  startBtn.addEventListener("click", start);

  /* ---------- preview tools (add ?preview=1 to the page link) ---------- */
  var params = new URLSearchParams(window.location.search);
  if (params.get("preview") === "1") {
    $("preview").classList.remove("hidden");
    var btns = $("preview").querySelectorAll("button[data-n]");
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener("click", function () {
        var n = parseInt(this.getAttribute("data-n"), 10);
        render(n, n > 0, true);
        play("press"); ringPulse(); burst(24);
        celebrate(levelFor(n, n > 0));
      });
    }
    $("resetBtn").addEventListener("click", function () {
      try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      memory = null;
      state = { started: false, startDate: "", lastPress: "", streak: 0, best: 0 };
      brokeNow = false;
      render(0, false, false);
    });
  }

  /* ---------- go ---------- */
  checkMissedDay();
  render(state.streak, state.started, false);

  // if the tab stays open past midnight, re-check when the player comes back to it
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      var was = state.streak;
      checkMissedDay();
      render(state.streak, state.started, false);
    }
  });
})();
</script>
</body>
</html>
